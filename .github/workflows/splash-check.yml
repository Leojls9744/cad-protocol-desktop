name: Splash check (temporary)

# Starts the app on real Windows and takes a picture of the screen every
# 250 ms, to see the start-up card and the closing card as a person does.

on:
  push:
    branches: [splash-check]

permissions:
  contents: write

jobs:
  look:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [splash-check]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Open the variants and photograph the screen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Shot($name) {
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shots "$name.jpg"), [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $g.Dispose(); $bmp.Dispose()
          }
          $electron = Resolve-Path "node_modules/electron/dist/electron.exe"
          foreach ($mode in "guard", "now") {
            $env:CADP_MODE = "now"
            $env:CADP_GUARD = $(if ($mode -eq "guard") { "1" } else { "0" })
            $out = Join-Path $env:RUNNER_TEMP "load-$mode.log"
            $p = Start-Process -FilePath $electron -ArgumentList "test/splash-load.js" -PassThru -RedirectStandardOutput $out
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            for ($i = 1; $i -le 24; $i++) {
              while ($sw.ElapsedMilliseconds -lt ($i * 250)) { Start-Sleep -Milliseconds 20 }
              Shot ("{0}-{1:D2}-{2}ms" -f $mode, $i, $sw.ElapsedMilliseconds)
            }
            $p.WaitForExit(15000) | Out-Null
            "== $mode"; Get-Content $out
            Start-Sleep -Seconds 1
          }
      - name: Keep the pictures on a branch of their own
        shell: bash
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q -b shots
          git config user.name "splash-check"
          git config user.email "splash-check@users.noreply.github.com"
          git add -A && git commit -qm "shots ${{ matrix.ref }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:splash-shots-${{ strategy.job-index }}
