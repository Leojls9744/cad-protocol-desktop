name: Build Windows installer

# Every push builds the installer and checks it on real Windows; the
# installer is kept with the run for 30 days. A version tag (v1.0.0 and so
# on), or running this by hand with "draft release" ticked, also makes a
# draft release with the installer and its SHA-256, which a maintainer
# publishes after looking it over. If that version's release is already
# published, the installer and SHA-256 are added to it instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also release the version in package.json: a draft, or the files added to it if already published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check the packaged app on Windows
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/win-unpacked/*.exe" | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          # 1.11: a .cadp handed over as a double-click does (a path with spaces).
          $cadp = Join-Path $env:RUNNER_TEMP "Smith ALTA.cadp"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out", "`"$cadp`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app didn't finish its check in 3 minutes." }
          if (Test-Path "$out.log") { Get-Content "$out.log" }
          if (-not (Test-Path $out)) { throw "The app didn't write its check." }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($r.error) { throw "The check failed: $($r.error)" }
          if (-not $r.supported) { throw "Pointer speed isn't available in the packaged app." }
          if ($r.during -ne $r.target) { throw "Setting the pointer speed didn't take." }
          if ($r.after -ne $r.before) { throw "The pointer speed wasn't put back." }
          if ($r.config.signIn -ne "signin") { throw "Internet Identity windows aren't recognised." }
          if (@($r.launched).Count -ne 1 -or @($r.launched)[0] -ne $cadp) { throw "A double-clicked .cadp wasn't found on the command line: $($r.launched -join ', ')" }
          # 1.13: a small browser window opened, found, put in place and closed.
          $w = $r.smallWindow
          if (-not $w.supported) { throw "The small sign-in window isn't available in the packaged app." }
          if (-not $w.exe) { throw "No Chrome or Edge was found for the small sign-in window." }
          if (-not $w.opened) { throw "The browser didn't start for the small sign-in window." }
          if (-not $w.found) { throw "The small sign-in window wasn't found after it opened." }
          if ([math]::Abs($w.rect.x - $w.want.x) -gt 16 -or [math]::Abs($w.rect.y - $w.want.y) -gt 16) { throw "The small sign-in window wasn't put in place: $($w.rect.x),$($w.rect.y)" }
          if ([math]::Abs($w.rect.width - $w.want.width) -gt 16 -or [math]::Abs($w.rect.height - $w.want.height) -gt 16) { throw "The small sign-in window wasn't sized: $($w.rect.width) x $($w.rect.height)" }
          if (-not $w.closed) { throw "The small sign-in window wasn't closed." }
          if (@($w.notes).Count -gt 0) { throw "The small sign-in window had trouble: $($w.notes -join '; ')" }
          # 1.14: a sign-in window of the app's own, over a card, in front of it, closed by Cancel.
          $s = $r.signInWindow
          if (-not $s.visible) { throw "The app's sign-in window didn't show." }
          if (-not $s.owned) { throw "The app's sign-in window isn't in front of its card." }
          if ([math]::Abs($s.rect.x - $s.want.x) -gt 16 -or [math]::Abs($s.rect.y - $s.want.y) -gt 16) { throw "The app's sign-in window wasn't put over the card: $($s.rect.x),$($s.rect.y)" }
          if ([math]::Abs($s.rect.width - $s.want.width) -gt 16 -or [math]::Abs($s.rect.height - $s.want.height) -gt 16) { throw "The app's sign-in window wasn't sized: $($s.rect.width) x $($s.rect.height)" }
          if ($s.title -ne "Internet Identity") { throw "The app's sign-in window is titled $($s.title)." }
          if (-not $s.closed) { throw "The app's sign-in window wasn't closed." }
          # 1.15: cadprotocol:// links are the app's, and never a drawing.
          $l = $r.appLink
          if (-not $l.said -or -not $l.ours) { throw "cadprotocol:// links weren't registered to the app." }
          if (-not $l.open) { throw "A cadprotocol:// link isn't recognised." }
          if ($l.files -ne 0) { throw "A cadprotocol:// link was read as a drawing." }
          # 1.3 on: what the app updates itself from.
          if (-not (Test-Path "dist/win-unpacked/resources/app-update.yml")) { throw "app-update.yml is missing from the app." }
          if (-not (Test-Path "dist/latest.yml")) { throw "latest.yml wasn't made." }
          Get-Content "dist/latest.yml"

      - name: SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum CAD-Protocol-Setup.exe | sed 's/ \*/  /' | tee SHA256SUMS.txt

      - name: Check the installer makes .cadp files the app's
        shell: pwsh
        run: |
          # 1.11: installed for this user, silently, as an update would.
          $setup = Start-Process -FilePath "dist/CAD-Protocol-Setup.exe" -ArgumentList "/S" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "The installer stopped with $($setup.ExitCode)." }
          $classes = "HKCU:\Software\Classes"
          $progId = (Get-ItemProperty -Path "$classes\.cadp").'(default)'
          if ($progId -ne "CADProtocol.Drawing") { throw ".cadp isn't the app's: $progId" }
          $type = (Get-ItemProperty -Path "$classes\$progId").'(default)'
          $icon = (Get-ItemProperty -Path "$classes\$progId\DefaultIcon").'(default)'
          $command = (Get-ItemProperty -Path "$classes\$progId\shell\open\command").'(default)'
          Write-Output "type: $type"; Write-Output "icon: $icon"; Write-Output "command: $command"
          if (-not (Test-Path ($icon.Trim('"')))) { throw "The .cadp icon wasn't installed: $icon" }
          if ($icon -notlike '*icon.ico*') { throw ".cadp files don't show the app's icon: $icon" }
          if ($command -notlike '*CAD Protocol.exe*"%1"*') { throw "Double-click doesn't open CAD Protocol: $command" }

      - name: Check cadprotocol:// links open the installed app
        shell: pwsh
        run: |
          # 1.15: registered by the installer (the check above left them at the build's own copy).
          $link = "HKCU:\Software\Classes\cadprotocol"
          if (-not (Test-Path $link)) { throw "cadprotocol:// isn't registered." }
          if ($null -eq (Get-ItemProperty -Path $link).'URL Protocol') { throw "cadprotocol:// isn't registered as a link." }
          $linkCommand = (Get-ItemProperty -Path "$link\shell\open\command").'(default)'
          Write-Output "link command: $linkCommand"
          if ($linkCommand -notlike '*CAD Protocol.exe*"%1"*') { throw "cadprotocol:// doesn't open CAD Protocol: $linkCommand" }
          if ($linkCommand -like '*win-unpacked*') { throw "cadprotocol:// opens the build's copy, not the installed app: $linkCommand" }
          # A link starts the app; a second, dressed up as a drawing, comes to the app that's open.
          $log = Join-Path $env:APPDATA "CAD Protocol\desktop.log"
          if (Test-Path $log) { Remove-Item $log }
          $said = { param($words) (Test-Path $log) -and (Select-String -Path $log -SimpleMatch $words -Quiet) }
          Start-Process "cadprotocol://open"
          $until = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $until -and -not (& $said "started by a cadprotocol link")) { Start-Sleep -Milliseconds 500 }
          if (-not (& $said "started by a cadprotocol link")) {
            Get-Process | Where-Object { $_.ProcessName -like "CAD*" } | Format-Table Id, ProcessName, StartTime
            if (Test-Path $log) { Get-Content $log }
            throw "A cadprotocol:// link didn't start the app."
          }
          Start-Sleep -Seconds 6
          $cadp = (Join-Path $env:RUNNER_TEMP "Smith ALTA.cadp") -replace '\\', '/'
          Start-Process "cadprotocol://open/$cadp"
          $until = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $until -and -not (& $said "brought to the front by a cadprotocol link")) { Start-Sleep -Milliseconds 500 }
          Get-Content $log
          $running = @(Get-Process -Name "CAD Protocol" -ErrorAction SilentlyContinue)
          Write-Output "windows: $(($running | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle }) -join ' | ')"
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (& $said "brought to the front by a cadprotocol link")) { throw "A second cadprotocol:// link didn't reach the open app." }

      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Protocol-Setup
          retention-days: 30
          path: |
            dist/CAD-Protocol-Setup.exe
            dist/CAD-Protocol-Setup.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          {
            cat RELEASE_NOTES.md
            echo
            echo "SHA-256 of CAD-Protocol-Setup.exe:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id >/dev/null 2>&1; then
            # Already published (for instance by hand on GitHub): attach the
            # files to it, replacing any old ones, and refresh its notes.
            gh release upload "$tag" dist/CAD-Protocol-Setup.exe dist/CAD-Protocol-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/CAD-Protocol-Setup.exe dist/CAD-Protocol-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt \
              --draft --target "$GITHUB_SHA" --title "CAD Protocol for Windows $tag" --notes-file notes.md
          fi
