name: Build Windows installer

# Every push builds the installer and checks it on real Windows; the
# installer is kept with the run for 30 days. A version tag (v1.0.0 and so
# on), or running this by hand with "draft release" ticked, also makes a
# draft release with the installer and its SHA-256, which a maintainer
# publishes after looking it over. If that version's release is already
# published, the installer and SHA-256 are added to it instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also release the version in package.json: a draft, or the files added to it if already published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 1.19: the scan engine (engine/, Rust), its tests, and its add-on
      # built for the app (engine/dist/cadp-engine.node).
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Scan engine tests
        working-directory: engine
        run: cargo test -p cadp-engine-core -p cadp-engine-view --release

      - name: Build the scan engine
        run: npm run build:engine

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check the packaged app on Windows
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/win-unpacked/*.exe" | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          # 1.11: a .cadp handed over as a double-click does (a path with spaces).
          $cadp = Join-Path $env:RUNNER_TEMP "Smith ALTA.cadp"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out", "`"$cadp`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app didn't finish its check in 3 minutes." }
          if (Test-Path "$out.log") { Get-Content "$out.log" }
          if (-not (Test-Path $out)) { throw "The app didn't write its check." }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($r.error) { throw "The check failed: $($r.error)" }
          if (-not $r.supported) { throw "Pointer speed isn't available in the packaged app." }
          if ($r.during -ne $r.target) { throw "Setting the pointer speed didn't take." }
          if ($r.after -ne $r.before) { throw "The pointer speed wasn't put back." }
          if ($r.config.signIn -ne "signin") { throw "Internet Identity windows aren't recognised." }
          if (@($r.launched).Count -ne 1 -or @($r.launched)[0] -ne $cadp) { throw "A double-clicked .cadp wasn't found on the command line: $($r.launched -join ', ')" }
          # 1.13: a small browser window opened, found, put in place and closed.
          $w = $r.smallWindow
          if (-not $w.supported) { throw "The small sign-in window isn't available in the packaged app." }
          if (-not $w.exe) { throw "No Chrome or Edge was found for the small sign-in window." }
          if (-not $w.opened) { throw "The browser didn't start for the small sign-in window." }
          if (-not $w.found) { throw "The small sign-in window wasn't found after it opened." }
          if ([math]::Abs($w.rect.x - $w.want.x) -gt 16 -or [math]::Abs($w.rect.y - $w.want.y) -gt 16) { throw "The small sign-in window wasn't put in place: $($w.rect.x),$($w.rect.y)" }
          if ([math]::Abs($w.rect.width - $w.want.width) -gt 16 -or [math]::Abs($w.rect.height - $w.want.height) -gt 16) { throw "The small sign-in window wasn't sized: $($w.rect.width) x $($w.rect.height)" }
          if (-not $w.closed) { throw "The small sign-in window wasn't closed." }
          if (@($w.notes).Count -gt 0) { throw "The small sign-in window had trouble: $($w.notes -join '; ')" }
          # 1.14: a sign-in window of the app's own, over a card, in front of it, closed by Cancel.
          $s = $r.signInWindow
          if (-not $s.visible) { throw "The app's sign-in window didn't show." }
          if (-not $s.owned) { throw "The app's sign-in window isn't in front of its card." }
          if ([math]::Abs($s.rect.x - $s.want.x) -gt 16 -or [math]::Abs($s.rect.y - $s.want.y) -gt 16) { throw "The app's sign-in window wasn't put over the card: $($s.rect.x),$($s.rect.y)" }
          if ([math]::Abs($s.rect.width - $s.want.width) -gt 16 -or [math]::Abs($s.rect.height - $s.want.height) -gt 16) { throw "The app's sign-in window wasn't sized: $($s.rect.width) x $($s.rect.height)" }
          if ($s.title -ne "Internet Identity") { throw "The app's sign-in window is titled $($s.title)." }
          if (-not $s.closed) { throw "The app's sign-in window wasn't closed." }
          # 1.15: cadprotocol:// links are the app's, and never a drawing.
          $l = $r.appLink
          if (-not $l.said -or -not $l.ours) { throw "cadprotocol:// links weren't registered to the app." }
          if (-not $l.open) { throw "A cadprotocol:// link isn't recognised." }
          if ($l.files -ne 0) { throw "A cadprotocol:// link was read as a drawing." }
          # 1.16: the faster graphics card asked for before the app was ready.
          Write-Output "graphics: asked for $($r.graphics.asked); cards: $($r.graphics.cards)"
          if ($r.graphics.asked -ne "high") { throw "The faster graphics card wasn't asked for: $($r.graphics.asked)" }
          if (-not $r.graphics.onCommandLine) { throw "The faster graphics card's switch isn't on the app's command line." }
          # 1.19: the scan engine in the packaged app: a scan indexed, the point under a cursor found, opened again from its index.
          $e = $r.engine
          Write-Output "scan engine: $($e | ConvertTo-Json -Depth 4 -Compress)"
          if (-not $e.first) { throw "The scan engine didn't run." }
          if (-not $e.first.built) { throw "The scan engine didn't index the check's scan." }
          if ($e.first.count -ne 10040) { throw "The scan engine read $($e.first.count) points, not 10040." }
          if ($e.first.error) { throw "The scan engine's snap failed: $($e.first.error)" }
          if ($e.first.near -lt 1) { throw "The scan engine found no point under the cursor." }
          if ([math]::Abs($e.first.frontZ - 104) -gt 0.001 -or $e.first.frontClass -ne 5) { throw "The scan engine's point under the cursor was at $($e.first.frontZ) (class $($e.first.frontClass)), not the post's top." }
          if ($e.again.built) { throw "The scan engine indexed the scan again instead of opening its index." }
          # 1.20: every point in a box, then thinned.
          if ($e.first.region.error) { throw "The scan engine's box failed: $($e.first.region.error)" }
          if ($e.first.region.count -ne 10040 -or -not $e.first.region.complete) { throw "The scan engine's box gave $($e.first.region.count) points, not all 10040." }
          if ($e.first.thinned.complete -or $e.first.thinned.count -lt 1000 -or $e.first.thinned.count -gt 2500) { throw "The scan engine's thinned box gave $($e.first.thinned.count) points." }
          # 1.22: cloud to cloud: the second scan lined up 0.2 east, then the two measured.
          if ($e.first.align.error) { throw "The scan engine's cloud to cloud failed: $($e.first.align.error)" }
          if (-not $e.first.align.refined -or [math]::Abs($e.first.align.east - 0.2) -gt 0.005) { throw "The scan engine lined the scans up $($e.first.align.east) east, not 0.2." }
          if ($e.first.check.error) { throw "The scan engine's measuring failed: $($e.first.check.error)" }
          if ($e.first.check.pairs -ne 1 -or $e.first.check.gaps -ne 20000) { throw "The scan engine measured $($e.first.check.pairs) pairs and $($e.first.check.gaps) points." }
          # 1.23: Geo W. over a floor's points.
          if ($e.first.classify.error) { throw "The scan engine's Geo W. failed: $($e.first.classify.error)" }
          if ($e.first.classify.points -ne 5000 -or $e.first.classify.cubes -lt 100) { throw "The scan engine's Geo W. classed $($e.first.classify.points) points in $($e.first.classify.cubes) cubes." }
          # 1.24: an E57 of two setups: indexed, snapped to, one setup asked of alone.
          if ($e.first.e57.count -ne 5202 -or -not $e.first.e57.setups) { throw "The scan engine read $($e.first.e57.count) points of the E57 (setups: $($e.first.e57.setups)), not 5202 in two setups." }
          if ($e.first.e57.snapError -or [math]::Abs($e.first.e57.frontZ - 200) -gt 0.001) { throw "The scan engine's E57 snap found z $($e.first.e57.frontZ), not 200: $($e.first.e57.snapError)" }
          if ($e.first.e57.boxError -or $e.first.e57.firstSetup -ne 2601 -or ($e.first.e57.setupOf -join ',') -ne '0') { throw "The scan engine's first E57 setup gave $($e.first.e57.firstSetup) points (setups $($e.first.e57.setupOf -join ',')), not 2601 of setup 0." }
          # 1.25: the engine's process stopped, started again with its scans, asked again on a new port.
          $s = $e.again.restart
          if (-not $s) { throw "The scan engine's restart wasn't checked." }
          if (-not $s.again -or $s.dropped -ne 0 -or -not $s.running) { throw "The scan engine didn't start again with its scans (again $($s.again), dropped $($s.dropped), running $($s.running))." }
          if ($s.error -or $s.near -lt 1 -or [math]::Abs($s.frontZ - 104) -gt 0.001) { throw "The scan engine's snap after it started again found z $($s.frontZ): $($s.error)" }
          if (-not (Test-Path "dist/win-unpacked/resources/app.asar.unpacked/engine/dist/cadp-engine.node")) { throw "The scan engine's add-on isn't unpacked beside the app." }
          # 1.34: the layer trial's two windows: the page's kept over the frame's inside, moved, sized, maximized and closed with it.
          $t = $r.layerTrial
          Write-Output "layer trial: $($t | ConvertTo-Json -Depth 5 -Compress)"
          if (-not $t) { throw "The layer trial wasn't checked." }
          if ($t.error) { throw "The layer trial's check failed: $($t.error)" }
          if (-not $t.owned) { throw "The layer trial's page window isn't owned by its frame." }
          foreach ($name in "first", "moved", "maximized") {
            $w = $t.$name
            if ($w.page.x -ne $w.inside.x -or $w.page.y -ne $w.inside.y -or $w.page.width -ne $w.inside.width -or $w.page.height -ne $w.inside.height) {
              throw "The layer trial's page window wasn't over its frame's inside ($name): $($w.page | ConvertTo-Json -Compress) against $($w.inside | ConvertTo-Json -Compress)"
            }
          }
          if (-not $t.maximized.is) { throw "The layer trial's frame didn't maximize." }
          if (-not $t.closed) { throw "The layer trial's windows didn't close together." }
          # 1.35: the scan engine's own window in the frame: its ring, then the check's scan, drawn on this computer's card (its processor's stand-in) and seen on the screen under the page.
          $v = $r.engine.first.view
          Write-Output "engine view: $($v | ConvertTo-Json -Depth 6 -Compress)"
          if (-not $v) { Write-Output "::warning::The engine's own window wasn't tried." }
          elseif ($v.error) { Write-Output "::warning::The engine's own window: $($v.error)" }
          else {
            Write-Output "engine view on screen: ring drawn $($v.ringDrawn), engine under the page $($v.engineUnder), page over it $($v.pageOver); scan: post $($v.postDrawn), floor $($v.floorDrawn), off it the page's background $($v.offClear), by class with a layer off $($v.classDrawn), eye-dome lighting $($v.litDrawn), shading $($v.shadeDrawn) in $($v.shaded.shadeMs) ms, a limit box and a slice $($v.clipDrawn), faint and gaps filled $($v.fillDrawn), kept and not drawn $($v.hiddenClear); card: $($v.ring.adapter)"
            if (-not ($v.ringDrawn -and $v.engineUnder -and $v.pageOver -and $v.postDrawn -and $v.floorDrawn -and $v.offClear -and $v.classDrawn -and $v.litDrawn -and $v.shadeDrawn -and $v.clipDrawn -and $v.fillDrawn -and $v.hiddenClear)) { Write-Output "::warning::The engine's own window didn't show as expected: $($v.ringPixels | ConvertTo-Json -Compress) $($v.scanPixels | ConvertTo-Json -Compress) $($v.classPixels | ConvertTo-Json -Compress) $($v.litPixels | ConvertTo-Json -Compress) $($v.shadePixels | ConvertTo-Json -Compress) $($v.clipPixels | ConvertTo-Json -Compress) $($v.fillPixels | ConvertTo-Json -Compress) $($v.hiddenPixels | ConvertTo-Json -Compress)" }
          }
          # What the screen showed is said, not failed on (a trial: the picture's kept to look at).
          if ($t.shot.width -gt 0) {
            Write-Output "layer trial on screen: bar over $($t.barOver), layer through $($t.layerThrough), line over $($t.lineOver)"
            if (-not ($t.barOver -and $t.layerThrough -and $t.lineOver)) { Write-Output "::warning::The layer trial's screen didn't show the page over the layer: $($t.pixels | ConvertTo-Json -Compress)" }
          } else { Write-Output "::warning::The layer trial's screen couldn't be looked at: $($t.shotError)" }
          # 1.3 on: what the app updates itself from.
          if (-not (Test-Path "dist/win-unpacked/resources/app-update.yml")) { throw "app-update.yml is missing from the app." }
          if (-not (Test-Path "dist/latest.yml")) { throw "latest.yml wasn't made." }
          Get-Content "dist/latest.yml"

      - name: SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum CAD-Protocol-Setup.exe | sed 's/ \*/  /' | tee SHA256SUMS.txt

      - name: Check the installer makes .cadp files the app's
        shell: pwsh
        run: |
          # 1.11: installed for this user, silently, as an update would.
          $setup = Start-Process -FilePath "dist/CAD-Protocol-Setup.exe" -ArgumentList "/S" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "The installer stopped with $($setup.ExitCode)." }
          $classes = "HKCU:\Software\Classes"
          $progId = (Get-ItemProperty -Path "$classes\.cadp").'(default)'
          if ($progId -ne "CADProtocol.Drawing") { throw ".cadp isn't the app's: $progId" }
          $type = (Get-ItemProperty -Path "$classes\$progId").'(default)'
          $icon = (Get-ItemProperty -Path "$classes\$progId\DefaultIcon").'(default)'
          $command = (Get-ItemProperty -Path "$classes\$progId\shell\open\command").'(default)'
          Write-Output "type: $type"; Write-Output "icon: $icon"; Write-Output "command: $command"
          if (-not (Test-Path ($icon.Trim('"')))) { throw "The .cadp icon wasn't installed: $icon" }
          if ($icon -notlike '*icon.ico*') { throw ".cadp files don't show the app's icon: $icon" }
          if ($command -notlike '*CAD Protocol.exe*"%1"*') { throw "Double-click doesn't open CAD Protocol: $command" }

      - name: Check cadprotocol:// links open the installed app
        shell: pwsh
        run: |
          # 1.15: registered by the installer (the check above left them at the build's own copy).
          $link = "HKCU:\Software\Classes\cadprotocol"
          if (-not (Test-Path $link)) { throw "cadprotocol:// isn't registered." }
          if ($null -eq (Get-ItemProperty -Path $link).'URL Protocol') { throw "cadprotocol:// isn't registered as a link." }
          $linkCommand = (Get-ItemProperty -Path "$link\shell\open\command").'(default)'
          Write-Output "link command: $linkCommand"
          if ($linkCommand -notlike '*CAD Protocol.exe*"%1"*') { throw "cadprotocol:// doesn't open CAD Protocol: $linkCommand" }
          if ($linkCommand -like '*win-unpacked*') { throw "cadprotocol:// opens the build's copy, not the installed app: $linkCommand" }
          # A link starts the app; a second, dressed up as a drawing, comes to the app that's open.
          $log = Join-Path $env:APPDATA "CAD Protocol\desktop.log"
          if (Test-Path $log) { Remove-Item $log }
          $said = { param($words) (Test-Path $log) -and (Select-String -Path $log -SimpleMatch $words -Quiet) }
          Start-Process "cadprotocol://open"
          $until = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $until -and -not (& $said "started by a cadprotocol link")) { Start-Sleep -Milliseconds 500 }
          if (-not (& $said "started by a cadprotocol link")) {
            Get-Process | Where-Object { $_.ProcessName -like "CAD*" } | Format-Table Id, ProcessName, StartTime
            if (Test-Path $log) { Get-Content $log }
            throw "A cadprotocol:// link didn't start the app."
          }
          Start-Sleep -Seconds 6
          $cadp = (Join-Path $env:RUNNER_TEMP "Smith ALTA.cadp") -replace '\\', '/'
          Start-Process "cadprotocol://open/$cadp"
          $until = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $until -and -not (& $said "brought to the front by a cadprotocol link")) { Start-Sleep -Milliseconds 500 }
          Get-Content $log
          $running = @(Get-Process -Name "CAD Protocol" -ErrorAction SilentlyContinue)
          Write-Output "windows: $(($running | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle }) -join ' | ')"
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (& $said "brought to the front by a cadprotocol link")) { throw "A second cadprotocol:// link didn't reach the open app." }

      # 1.34: the screen as the layer trial's check saw it, and the whole check, to look at.
      - name: Keep the layer trial's picture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-trial
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/smoke.json.log
            ${{ runner.temp }}/smoke.json.layer.png
            ${{ runner.temp }}/smoke.json.layer.ring.png
            ${{ runner.temp }}/smoke.json.layer.scan.png

      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Protocol-Setup
          retention-days: 30
          path: |
            dist/CAD-Protocol-Setup.exe
            dist/CAD-Protocol-Setup.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          {
            cat RELEASE_NOTES.md
            echo
            echo "SHA-256 of CAD-Protocol-Setup.exe:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id >/dev/null 2>&1; then
            # Already published (for instance by hand on GitHub): attach the
            # files to it, replacing any old ones, and refresh its notes.
            gh release upload "$tag" dist/CAD-Protocol-Setup.exe dist/CAD-Protocol-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/CAD-Protocol-Setup.exe dist/CAD-Protocol-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt \
              --draft --target "$GITHUB_SHA" --title "CAD Protocol for Windows $tag" --notes-file notes.md
          fi
