name: Build Windows installer

# Every push builds the installer and checks it on real Windows; the
# installer is kept with the run for 30 days. A version tag (v1.0.0 and so
# on), or running this by hand with "draft release" ticked, also makes a
# draft release with the installer and its SHA-256, which a maintainer
# publishes after looking it over. If that version's release is already
# published, the installer and SHA-256 are added to it instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also release the version in package.json: a draft, or the files added to it if already published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check the packaged app on Windows
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/win-unpacked/*.exe" | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "The app didn't finish its check in 90 seconds." }
          if (Test-Path "$out.log") { Get-Content "$out.log" }
          if (-not (Test-Path $out)) { throw "The app didn't write its check." }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($r.error) { throw "The check failed: $($r.error)" }
          if (-not $r.supported) { throw "Pointer speed isn't available in the packaged app." }
          if ($r.during -ne $r.target) { throw "Setting the pointer speed didn't take." }
          if ($r.after -ne $r.before) { throw "The pointer speed wasn't put back." }
          if ($r.config.signIn -ne "signin") { throw "Internet Identity windows aren't recognised." }

      - name: SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum CAD-Protocol-Setup.exe | sed 's/ \*/  /' | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Protocol-Setup
          retention-days: 30
          path: |
            dist/CAD-Protocol-Setup.exe
            dist/SHA256SUMS.txt

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          {
            cat RELEASE_NOTES.md
            echo
            echo "SHA-256 of CAD-Protocol-Setup.exe:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id >/dev/null 2>&1; then
            # Already published (for instance by hand on GitHub): attach the
            # files to it, replacing any old ones, and refresh its notes.
            gh release upload "$tag" dist/CAD-Protocol-Setup.exe dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/CAD-Protocol-Setup.exe dist/SHA256SUMS.txt \
              --draft --target "$GITHUB_SHA" --title "CAD Protocol for Windows $tag" --notes-file notes.md
          fi
