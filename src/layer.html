<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>CAD Protocol</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b1020; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // The layer trial's test picture (1.34, layer-trial.js): what's under
      // the app's page while the trial's on. A grid that drifts and a ring
      // that goes round, so a missed frame shows; a yellow line along the
      // layer's own edges and a ruler from its top-left corner, so the page
      // sitting a pixel off the layer shows; and the frames a second it's
      // drawn at. In Trial B the engine's scan takes its place.
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      let w = 0;
      let h = 0;
      let k = 1;
      function size() {
        k = window.devicePixelRatio || 1;
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * k);
        canvas.height = Math.round(h * k);
      }
      window.addEventListener("resize", size);
      size();
      let last = performance.now();
      let frames = 0;
      let since = last;
      let fps = 0;
      let slow = 0;
      function draw(now) {
        const dt = now - last;
        last = now;
        frames += 1;
        if (dt > 25) slow += 1;
        if (now - since >= 1000) {
          fps = Math.round((frames * 1000) / (now - since));
          frames = 0;
          since = now;
        }
        ctx.setTransform(k, 0, 0, k, 0, 0);
        ctx.fillStyle = "#0b1020";
        ctx.fillRect(0, 0, w, h);
        // The drifting grid.
        const t = now / 1000;
        const step = 50;
        const ox = (t * 40) % step;
        const oy = (t * 25) % step;
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#1f3a6b";
        ctx.beginPath();
        for (let x = ox; x < w; x += step) {
          ctx.moveTo(Math.round(x) + 0.5, 0);
          ctx.lineTo(Math.round(x) + 0.5, h);
        }
        for (let y = oy; y < h; y += step) {
          ctx.moveTo(0, Math.round(y) + 0.5);
          ctx.lineTo(w, Math.round(y) + 0.5);
        }
        ctx.stroke();
        // The ring going round the middle.
        const cx = w / 2;
        const cy = h / 2;
        const r = Math.min(w, h) * 0.22;
        ctx.strokeStyle = "#2f6fd6";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#39d98a";
        ctx.beginPath();
        ctx.arc(cx + Math.cos(t * 2) * r, cy + Math.sin(t * 2) * r, 9, 0, Math.PI * 2);
        ctx.fill();
        // The layer's own edges, and a ruler from its top-left corner.
        ctx.strokeStyle = "#ffd60a";
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, w - 2, h - 2);
        ctx.fillStyle = "#ffd60a";
        ctx.font = "11px Segoe UI, system-ui, sans-serif";
        ctx.textBaseline = "top";
        for (let x = 100; x < w; x += 100) {
          ctx.fillRect(x, 2, 1, 8);
          ctx.fillRect(x, h - 10, 1, 8);
        }
        for (let y = 100; y < h; y += 100) {
          ctx.fillRect(2, y, 8, 1);
          ctx.fillRect(w - 10, y, 8, 1);
        }
        // What it is, and how it's drawing.
        ctx.textAlign = "center";
        ctx.fillStyle = "#e8ecf4";
        ctx.font = "600 20px Segoe UI, system-ui, sans-serif";
        ctx.fillText("Layer trial", cx, cy - 22);
        ctx.font = "13px Segoe UI, system-ui, sans-serif";
        ctx.fillStyle = "#9fb0cc";
        ctx.fillText("This picture is under the app's page", cx, cy + 6);
        ctx.fillText(`${fps} frames a second · ${slow} slow · ${w} × ${h}`, cx, cy + 26);
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
