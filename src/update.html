<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>CAD Protocol</title>
    <style>
      /* The start-up card (1.6): the app's picture with its icon and name,
         what's happening, and a bar in the Internet Computer's colors, as
         the app's own loading card has them (the app goes on from here). */
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #000;
        color: #ececf1;
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      .card {
        width: min(560px, 100%);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 10px;
        background: #0b0b0f;
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.9);
      }
      .art {
        display: flex;
        align-items: center;
        aspect-ratio: 560 / 236;
        padding: 0 32px;
        background: #000 url("splash.jpg") center / cover no-repeat;
      }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand svg { width: 56px; height: 56px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6)); }
      .name { margin: 0; color: #fff; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        background: #0e0e13;
      }
      .words { min-width: 0; }
      h1 { margin: 0; color: #d8d8e2; font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      p { margin: 0; color: #8d8d99; font-size: 11px; }
      p:empty { display: none; }
      .bar { position: relative; flex: 0 0 45%; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .bar span {
        position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 2px;
        background: linear-gradient(90deg, #29abe2 0%, #522785 30%, #ed1e79 55%, #f15a24 80%, #fbb03b 100%);
        transition: width 0.2s ease;
      }
      /* No percentage yet: a sweep. */
      .bar.waiting span { width: 40%; animation: sweep 1.3s ease-in-out infinite; }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar.waiting span { animation: none; left: 30%; } }
      small { display: block; margin-top: 10px; color: #6f6f78; text-align: center; }
      small:empty { display: none; }
      /* The card on its own (1.7, splash.js): it's the whole window, and
         the window's dragged by it. */
      body.splash { padding: 0; overflow: hidden; background: #0b0b0f; }
      body.splash main { width: 100vw; height: 100vh; }
      body.splash .card {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        -webkit-app-region: drag;
      }
      body.splash .art { flex: 1; aspect-ratio: auto; }
      body.splash small { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="art">
          <div class="brand">
            <!-- The app icon (build/icon.png's drawing). -->
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#2f8bff" />
                  <stop offset="0.38" stop-color="#7b4dff" />
                  <stop offset="0.68" stop-color="#e0459f" />
                  <stop offset="1" stop-color="#ff8a3d" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="14" fill="#000000" />
              <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#edge)" stroke-width="2" />
              <g transform="translate(9.6 9.6) scale(0.7)" fill="#ffffff" stroke="#ffffff">
                <rect x="23" y="23" width="18" height="18" rx="3" fill="none" stroke-width="4.5" />
                <path d="M32 11.5V17M32 47V52.5M11.5 32H17M47 32H52.5" stroke-width="4.5" stroke-linecap="round" fill="none" />
                <g stroke="none"><circle cx="32" cy="7" r="5" /><circle cx="32" cy="57" r="5" /><circle cx="7" cy="32" r="5" /><circle cx="57" cy="32" r="5" /></g>
              </g>
            </svg>
            <p class="name">CAD Protocol</p>
          </div>
        </div>
        <div class="foot">
          <div class="words">
            <h1 id="title">Checking for updates…</h1>
            <p id="detail">CAD Protocol for Windows</p>
          </div>
          <div class="bar waiting" id="bar"><span id="fill"></span></div>
        </div>
      </div>
      <small id="note"></small>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("splash") === "1")
        document.body.classList.add("splash");
      // The main process fills these in (main.js, updateScreen).
      window.showUpdate = (title, detail, percent, note) => {
        document.getElementById("title").textContent = title;
        document.getElementById("detail").textContent = detail || "";
        const bar = document.getElementById("bar");
        const fill = document.getElementById("fill");
        bar.classList.toggle("waiting", typeof percent !== "number");
        fill.style.width = typeof percent === "number" ? `${percent}%` : "";
        document.getElementById("note").textContent = note || "";
      };
    </script>
  </body>
</html>
